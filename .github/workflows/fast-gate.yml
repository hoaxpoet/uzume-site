name: Fast gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    name: fast-gate
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check JavaScript syntax
        run: |
          node --check DesignSystem/Web/catalogue.js
          node --check DesignSystem/Web/uzume-components.js

      - name: Check catalogue references
        run: python3 Scripts/check_web_catalogue.py

      - name: Check color contrast
        run: python3 Scripts/check_contrast.py tokens.css

      - name: Test Swift design-system package
        run: swift test --package-path DesignSystem/SwiftUI

      - name: Check patch whitespace
        run: |
          git diff --check \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            -- .github DesignSystem Scripts brand design tokens.css README.md
