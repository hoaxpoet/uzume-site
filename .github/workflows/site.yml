name: Site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type and content check
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Check links in the built site
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --no-progress --base dist --include-fragments 'dist/**/*.html'
          fail: true
