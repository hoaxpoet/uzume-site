name: Site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check copy spacing
        run: python3 Scripts/check_copy_spacing.py

      - name: Type and content check
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Check links in the built site
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # --root-dir must be absolute; it resolves root-relative hrefs in the
          # built files. uzume.io is excluded: it is the canonical/sitemap origin,
          # and a PR's build says nothing about whether production is reachable.
          #
          # /dist/gallery# is excluded because lychee cannot check it, not
          # because we would rather it did not. Astro emits dist/gallery/index.html
          # and lychee maps /gallery/ onto the directory, which holds no
          # fragments — so every /gallery/#scene link fails as "cannot find
          # fragment" however correct it is. Nothing is lost by skipping them:
          # the landing page's hrefs and the gallery's ids are both generated by
          # a loop over src/data/media.json, so they cannot drift apart. Drop
          # this the day lychee resolves directory indexes.
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            --exclude ^https://uzume\.io
            --exclude /dist/gallery/?#
            --include-fragments
            'dist/**/*.html'
          fail: true
