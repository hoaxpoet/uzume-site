<!--
  Uzume confirmation (double opt-in) email — Kit HTML block 1 of 2.

  THE CARD IS DELIBERATELY SPLIT. Kit's block order must be:

      1. this file            (HTML block)
      2. the confirm button   (Kit's native Button block — see KIT_SETUP.md)
      3. incentive-bottom.html(HTML block)

  The button carries Kit's own confirmation URL, so it cannot live in here: a
  hand-written merge tag would be a link that silently goes nowhere. Putting it
  BETWEEN the two halves rather than after them is the design, not a compromise
  — the light gap it opens across two fields of midnight is BRAND.md's First
  Opening, and it puts the one action this email exists for on the card's own
  ground instead of Kit's light one.

  This is a FRAGMENT, not a document. Kit owns <body>, the email background,
  the footer and the "Built with Kit" badge, so there is no <html>, <head> or
  <style> here: Gmail strips <head> styles and Outlook renders with Word's
  engine, so every rule is inline and every layout is a table.

  Token values are copied from tokens.css by hand — CSS variables cannot reach
  a mail client. If a token changes, change it here too.

  The <img> tags and their cells both carry colour and a font stack. That is
  not redundancy: images are blocked by default in many clients, and the alt
  text then inherits the client's default ink — which rendered the wordmark at
  1.07:1 on this card, i.e. invisible. Webmail reads the style off the <img>,
  Outlook reads it off the <td>, so both must declare it.

  The icon carries an empty alt: it is decoration beside the wordmark, and
  "Uzume Uzume" is what a screen reader would otherwise announce.

  The MSO conditional is load-bearing. Word's engine does not support
  max-width, so without the 520px ghost table the card spans the whole reading
  pane and the measure runs past 140 characters.
-->
